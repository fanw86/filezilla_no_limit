name: Build FileZilla

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Minimums from filezilla3/INSTALL. Used to fetch dependency tarballs.
  LIBFILEZILLA_VERSION: '0.57.0'
  FZSSH_VERSION: '1.4.0'
  SOURCE_DIR: filezilla3

jobs:
  windows-setup:
    name: Windows x64 + Setup
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            tar
            xz
            zip
            autoconf
            automake
            libtool
            make
            gettext
            pkgconf
            ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-nettle
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-python
            mingw-w64-x86_64-argon2
            mingw-w64-x86_64-boost
            mingw-w64-i686-toolchain

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ci-deps/prefix
            ${{ github.workspace }}/.ci-deps/src
          key: win64-deps-${{ env.LIBFILEZILLA_VERSION }}-${{ env.FZSSH_VERSION }}-nettle310-v3

      - name: Build libfilezilla and fzssh
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PREFIX="$(cygpath -u "${GITHUB_WORKSPACE}")/.ci-deps/prefix"
          export SRC_ROOT="$(cygpath -u "${GITHUB_WORKSPACE}")/.ci-deps/src"
          bash scripts/ci/fetch-deps.sh

      - name: Build FileZilla + NSIS setup
        run: |
          export PREFIX="$(cygpath -u "${GITHUB_WORKSPACE}")/.ci-deps/prefix"
          export OUT_DIR="$(cygpath -u "${GITHUB_WORKSPACE}")/dist"
          export WITH_SHELLEXT=1
          bash scripts/ci/build-windows.sh

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: FileZilla-Windows-Setup
          path: dist/*
          if-no-files-found: error

  windows-setup-no-shellext:
    name: Windows x64 Setup (no shell ext)
    runs-on: windows-latest
    # Optional faster/debug build without the 32-bit shell extension toolchain
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            tar
            xz
            zip
            autoconf
            automake
            libtool
            make
            gettext
            pkgconf
            ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-nettle
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-python
            mingw-w64-x86_64-argon2
            mingw-w64-x86_64-boost

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ci-deps/prefix
            ${{ github.workspace }}/.ci-deps/src
          key: win64-deps-${{ env.LIBFILEZILLA_VERSION }}-${{ env.FZSSH_VERSION }}-nettle310-v3

      - name: Build libfilezilla and fzssh
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PREFIX="$(cygpath -u "${GITHUB_WORKSPACE}")/.ci-deps/prefix"
          export SRC_ROOT="$(cygpath -u "${GITHUB_WORKSPACE}")/.ci-deps/src"
          bash scripts/ci/fetch-deps.sh

      - name: Build FileZilla + NSIS setup
        run: |
          export PREFIX="$(cygpath -u "${GITHUB_WORKSPACE}")/.ci-deps/prefix"
          export OUT_DIR="$(cygpath -u "${GITHUB_WORKSPACE}")/dist"
          export WITH_SHELLEXT=0
          bash scripts/ci/build-windows.sh

      - name: Upload Windows setup (no shell ext)
        uses: actions/upload-artifact@v4
        with:
          name: FileZilla-Windows-Setup-no-shellext
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool gettext pkg-config \
            libwxgtk3.2-dev nettle-dev libgnutls28-dev \
            libgmp-dev libargon2-dev libboost-regex-dev \
            libsqlite3-dev zlib1g-dev meson ninja-build xz-utils

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.ci-deps/prefix
            ${{ github.workspace }}/.ci-deps/src
          key: linux-deps-${{ env.LIBFILEZILLA_VERSION }}-${{ env.FZSSH_VERSION }}-nettle310-v3

      - name: Build libfilezilla and fzssh
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          export PREFIX="${GITHUB_WORKSPACE}/.ci-deps/prefix"
          export SRC_ROOT="${GITHUB_WORKSPACE}/.ci-deps/src"
          bash scripts/ci/fetch-deps.sh

      - name: Build FileZilla
        run: |
          export PREFIX="${GITHUB_WORKSPACE}/.ci-deps/prefix"
          export OUT_DIR="${GITHUB_WORKSPACE}/dist"
          bash scripts/ci/build-linux.sh

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: FileZilla-Linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach artifacts to release
    needs: [windows-setup, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
